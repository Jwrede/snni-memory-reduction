# SHARK: what is specific to this system. Instrument settings are NOT here, they are in
# campaign.env and apply to every system.

WORKDIR=/scratch/tmp/j_wred02/snni_campaign/shark
SBATCH=shark_campaign.sbatch
DERIVE=derive.sbatch

# Single pool (host). SHARK is C++ on its own `shark/protocols` stack with Eigen and OpenMP and no
# CUDA at all, so the VRAM component of the two-pool objective is absent. That is the degenerate
# case of the protocol rather than an exception to it.
#
# `-` means no step-name suffix: this IS the published run, with the host recorder riding along in
# it. One run suffices because the recorder costs one named mapping which is subtracted from the
# peak by name, so the peak and the object table describe the same instant by construction.
CHANNELS="-:PMREC=1"

# THREE PROCESSES, TWO OF THEM MEASURED, IN TWO PHASES.
#
# `benchmark-bert_instrumented 2` is the dealer: it writes server.dat and client.dat and exits.
# Only then can parties 0 and 1 start, because `init::eval` hands each online party a `Dealer`
# reading from its own file (init.cpp:38) while the dealer gets file-backed `Peer`s (init.cpp:15).
# The phases are forced by the protocol, not chosen.
#
# The poller attaches to parties 0 and 1 only. The dealer's peak is a different subject with a
# different floor (the earlier campaign measured it at 199 MB against a ~177 MB dealer floor,
# i.e. essentially AT its floor), and polling across both phases would publish the larger of the
# two under this system's name. The launcher writes party0.pid and party1.pid only when phase 2
# begins, so key generation cannot be measured here even by accident.
#
# KNOWN LIMITATION, INHERITED AND NOT FIXED HERE: on a multi-party system only the freeze LEADER's
# capture is atomic. One poller stops every party with a single kill, but only the leader's
# process is snapshotted while stopped. Fixing that means one poller capturing all parties in the
# stopped state, which lives in shared code (poll_peak.sh, measure.sh) and is a campaign decision
# rather than this system's. The consequence here is bounded and stated: party 0 is made the
# leader and party 0 is the party whose peak is published and decomposed, so the DECOMPOSITION
# that any step is chosen from is an atomic one. Party 1's trace is kept as evidence about
# symmetry and is not used to select anything.
