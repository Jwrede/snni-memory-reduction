# LLAMA dealer: what is specific to this system. Instrument settings are NOT here, they are in
# campaign.env and apply to every system.

WORKDIR=/scratch/tmp/j_wred02/snni_campaign/llama-dealer
SBATCH=llama_dealer.sbatch
DERIVE=derive.sbatch

# SINGLE POOL, so one measurement run per replicate, with the host recorder riding along in it.
# That is the degenerate case of the two-pool protocol rather than an exception: the VRAM
# component is absent. The recorder costs one named mapping, subtracted from the peak by name, so
# the peak and the object table describe the same instant by construction and no separate
# attribution run is needed.
#
# `-` means no step-name suffix: this IS the published run.
CHANNELS="-:PMREC=1"
