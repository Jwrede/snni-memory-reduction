# BumbleBee: what is specific to this system. Instrument settings are NOT here, they are in
# campaign.env and apply to every system.

WORKDIR=/scratch/tmp/j_wred02/snni_campaign/bumblebee
SBATCH=bumblebee.sbatch
DERIVE=derive.sbatch

# SINGLE POOL (host). BumbleBee is a CPU-only hybrid HE+MPC protocol, so the VRAM component of the
# objective is absent. That is the degenerate case of the two-pool protocol rather than an
# exception to it: one run per replicate, with the host recorder riding along in it, because the
# recorder costs one named mapping which is subtracted from the peak by name.
#
# `-` means no step-name suffix: this IS the published run.
CHANNELS="-:PMREC=1"

# TWO PARTIES, BOTH MEASURED, ONE NODE. op_bench runs rank 0 and rank 1 as separate processes
# talking over brpc on loopback, which is what makes per-party VmRSS meaningful at all. Both are
# polled; one poller is the freeze leader and holds BOTH parties with a single kill, because
# stopping one peer of a 2PC protocol while the other runs is not a pause, it is a protocol fault.
#
# The launcher writes party0.pid and party1.pid. It has to: both parties are the SAME binary with
# the same name and the same argv except for `--rank`, so neither /proc/<pid>/exe nor a cmdline
# match can tell them apart, and pairing a decomposition with the wrong party's mappings describes
# a run that never existed.
