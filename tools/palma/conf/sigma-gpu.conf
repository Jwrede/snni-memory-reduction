# SIGMA-GPU: what is specific to this system. Instrument settings are NOT here, they are in
# campaign.env and apply to every system.

WORKDIR=/scratch/tmp/j_wred02/sigma_gpu
SBATCH=sigma_gpu_campaign.sbatch
DERIVE=derive.sbatch

# ONE RUN PER STEP, ONE COMBINED CHANNEL (2026-08-21). This used to read
#
#     CHANNELS="-: _attrib:ATTRIB=1 _pmrec:PMREC=1"      # three runs per replicate
#
# and README.md says "Each step is measured by one run" -- the cost of the alternative being
# that the object list describes a moment the published run never had. On this system that cost was
# on the row: `host objects sampled at 2,064,968 kB, 3.5% below the 2,139,588 kB peak`.
#
# The prohibition on running both recorders together was inherited from memray and, on this system,
# from a measured freeze failure (`SigmaPeer::recvBytes` asserting `numRead == toRead` while
# `MSG_WAITALL` returns short under signal, jobs 45848688 and 45853567). That assert is replaced by
# `assert(numRead > 0)` in every `bin/sigma-*` this campaign builds, so the measured reason expired.
#
# MEASURED before the switch, H200: combined 2,148,612 kB, minus the 4,100 kB of recorder table that
# `smaps_objects.py` labels `instrument:`, gives 2,144,512 against the clean run's 2,140,384 -- 0.19%.
# Both tables are produced (31 pmtables, `device_table.txt` for both parties).
#
# The sbatch REFUSES a run that sets only one of the two, so this line cannot half-apply.
CHANNELS="-:PMREC=1,ATTRIB=1,SNNI_COMBINED=1"

# *** THIS SYSTEM CANNOT RUN ON THE MIG SLICE, AND THE CAMPAIGN'S HARDWARE TABLE SAID IT COULD.
#
# The baseline allocates a FIXED 40 GiB VRAM pool per party at startup (gpu_mem.cu:50,
# `bytes = 40*(1ULL<<30)`, cudaMallocAsync). A 2g.35gb MIG slice cannot hold that: measured, job
# 45099383, SIGMA OOMed in 10 seconds. Later steps fit easily once the warmup is removed, and the
# earlier campaign did run some of them on MIG.
#
# That does not make MIG an option. The unit of hardware placement is a WHOLE SYSTEM, never a
# step: a waterfall split across two machine types stops comparing its own steps to each other,
# which is the only comparison a waterfall makes. Since the baseline needs the full card, the
# whole line runs on the full card.
#
# The sbatch must therefore request `--partition=gpuh200 --gres=gpu:1`, both parties sharing the
# one card, as the earlier campaign's sigma_gpu_1gpu.sbatch did. Note that this is a queue cost:
# full-H200 jobs were estimated at ~4 days when gpu:2 was requested; gpu:1 was hours.

# REPLICATES: LOWERED TO ONE, 2026-08-06, at the user's instruction, for the same reason MOAI-CPU
# and ARION were: the binding constraint is a contended shared resource, not machine time.
#
# On this system a run takes 31 s, so compute is not the constraint at all -- NINE SLOT ACQUISITIONS are (three replicates x three channels), each waiting behind multi-day jobs on a partition with two live nodes and sixteen GPUs, all allocated. Cutting to one replicate is a 3x cut in queue exposure, not in machine time.
#
# WHAT IS GIVEN UP, STATED RATHER THAN GLOSSED: with n=1 a row carries no spread, so free-vs-paid
# cannot be decided against this system's own noise. `make_steps.py` no longer hides that -- it
# publishes `cost_type=undetermined` unless the step DECLARES its class in levers.env as
# `# cost_class: free` or `paid`, and the row then records that the class is declared rather than
# measured. A declaration is only honest where the argument does not need a spread: a buffer written
# by nothing and read by nothing costs nothing by construction, and no number of replicates would
# add to that.
#
# WHAT IS NOT GIVEN UP: this system's BASELINE was measured at n=3 and keeps its spread. Only the
# steps run singly, so every row is quoted against a predecessor whose reproducibility is
# established. That is a better position than MOAI-CPU's, where the baseline itself is n<3.
REPLICATES=1
