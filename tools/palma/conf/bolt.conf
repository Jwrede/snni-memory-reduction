# BOLT: what is specific to this system. Instrument settings are NOT here, they are in
# campaign.env and apply to every system.

WORKDIR=/scratch/tmp/j_wred02/snni_campaign/bolt
SBATCH=bolt_campaign.sbatch
DERIVE=derive.sbatch

# SINGLE POOL (host). BOLT is a CPU-only hybrid HE+MPC protocol, so the VRAM component of the
# objective is absent: the degenerate case of the two-pool protocol rather than an exception. One
# run per replicate with the host recorder riding along, because the recorder costs one named
# mapping whose resident size is subtracted from the peak by name.
CHANNELS="-:PMREC=1"

# TWO PARTIES, BOTH MEASURED, ONE NODE. ALICE (r=1) holds the quantised weights and is expected to
# bind the peak by roughly a factor of twenty; BOB (r=2) holds one input sample. They are the same
# binary with the same name and the same argv except for `r=`, so run_bolt.sh writes both pids and
# the harness reads them. One poller is the freeze leader and holds BOTH parties with a single
# kill: stopping one peer of a 2PC protocol while the other runs is a protocol fault, not a pause.
#
# SEAL SYSTEM: `SEAL_MALLOC` routes every 64-byte-multiple block through `aligned_alloc`, which the
# recorder did not intercept until 2026-07-30. Any object table of a SEAL system taken before that
# date is invalid and has to be re-derived rather than adjusted -- on BumbleBee the missing hook
# gave `named_frac` 0.42 and a plausible ranking of the wrong objects while the peak itself moved
# 0.02%, so nothing looked broken from the outside.
