# PUMA: what is specific to this system. Instrument settings are NOT here, they are in
# campaign.env and apply to every system.

WORKDIR=/scratch/tmp/j_wred02/snni_campaign/puma
SBATCH=puma_campaign.sbatch
DERIVE=derive.sbatch

# SINGLE POOL (host). PUMA is a CPU-only pure-MPC protocol, so the VRAM component of the objective
# is absent. That is the degenerate case of the two-pool protocol rather than an exception to it:
# one run per replicate, with the host recorder riding along in it, because the recorder costs one
# named mapping whose resident size is subtracted from the peak by name.
#
# `-` means no step-name suffix: this IS the published run.
CHANNELS="-:PMREC=1"

# SIX PROCESSES, ONE NODE, ALL POLLED. Three SPU nodes run the ABY3 protocol; P1 holds the input
# and P2 the plaintext model; the driver hands the model to P2 and reconstructs the result. They
# are five copies of one interpreter running one script with the same argv except for `-n node:i`,
# so neither /proc/<pid>/exe nor a cmdline match can tell them apart -- run_puma.sh writes each pid
# as it launches and the harness reads the files. One poller is the freeze leader and holds all six
# with a single kill, because stopping one peer of a 3PC protocol while the others run is not a
# pause, it is a protocol fault.
