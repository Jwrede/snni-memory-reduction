# SHAFT-CPU: what is specific to this system. Instrument settings are NOT here, they are in
# campaign.env and apply to every system.

WORKDIR=/scratch/tmp/j_wred02/snni_campaign/shaft-cpu
SBATCH=shaft_cpu_campaign.sbatch
DERIVE=derive.sbatch

# SINGLE POOL. SHAFT-CPU has no device pool at all, which README.md calls the degenerate case
# of the two-pool protocol rather than an exception. One run per replicate, with the host recorder
# riding along in it: the recorder costs one named mapping, whose resident size is read at the
# peak and subtracted by name, so the peak and the object table describe the same instant by
# construction and no separate attribution run is needed.
#
# `-` means no step-name suffix: this IS the published run.
#
# THE PYTHON CENSUS RIDES IN IT, and that it can is a measurement rather than a hope. This system
# is the one where the C recorder cannot name what it records: the program is Python, so the native
# stack runs numpy or ATen straight into the interpreter and never passes through the measured
# code, at any depth (`p_depth3`, `p_depth4`). The census walks the live objects from inside, at a
# signal, in the main thread.
#
# Measured against this step's three published runs:
#
#     wall   120 s   against 114 / 115 / 115      +4.5%, the same league as the recorder itself
#     peak   2,317,720 kB   against 2,312,748 / 2,322,056 / 2,319,608   INSIDE the spread
#
# So it stays in the ONE published run rather than a sibling, which is the rule this campaign paid
# for once already: an object list taken in a separate run described a moment the published run
# never had, and the two disagreed by 38.6%.
#
# The measured script is NOT modified for it. The signal handler is armed from `sitecustomize`,
# which rides in on PYTHONPATH, so `script_md5` is the published driver's either way.
CHANNELS="-:PMREC=1,SNNI_PY_CENSUS=1"
