# MOAI-CPU: what is specific to this system. Instrument settings are NOT here, they are in
# campaign.env and apply to every system.

WORKDIR=/scratch/tmp/j_wred02/snni_campaign/moai-cpu
SBATCH=moai_cpu_campaign.sbatch
DERIVE=derive.sbatch

# SINGLE POOL (host), SINGLE PROCESS. Non-interactive FHE: no device pool and no parties, so both
# degenerate cases apply at once. One run per replicate with the host recorder riding along.
#
# SNNI_POOLREC=1 IS DECLARED HERE, AND IT WAS AMBIENT BEFORE (fixed 2026-08-25). The recording SEAL
# pool is part of the measured system for this line: `m0_default` was measured with it, so every
# row must carry it or the line mixes two instruments. Until now it was switched on by exporting
# `SNNI_POOLREC=1` in the submitting shell, which `--export=ALL` then carried along. That works and
# leaves no trace: a run submitted from a shell that forgot it produces a complete, plausible
# measurement with no live-object table and nothing says so. It is the same shape as the defect
# `check_policy.sh` exists to catch, one level out -- a measurement setting living somewhere other
# than where the driver reads it.
#
# It belongs in the channel spec rather than in campaign.env because it is specific to this system:
# it is a SEAL pool, and fourteen of the fifteen systems have no such thing.
# SNNI_MARKER_SAMPLE=1 ADDED 2026-08-27, and it is why m0 is measured a third time.
#
# The procedure decomposes a peak at the instant RSS is highest. On this system that instant is not
# distinguished: measured on m0's own markers, the whole of layer 1 sits within 0.122% of the peak,
# four times tighter than this system's 0.53 pp spread, and `after_final`, `after_bootstrap3` and
# `after_layernorm2` report the IDENTICAL RSS -- a full bootstrap runs without moving one byte,
# because SEAL's pool serves it from the free list. Three runs of this line therefore reported three
# different rank-1 objects at "the peak", each correct for the moment it happened to freeze in.
#
# With this set, the poller takes one decomposition per phase marker as well, so every step of the
# line describes the SAME moment of the same computation and the tables become comparable. The peak
# value is unaffected: PEAK, peak.smaps and peak.status stay on the high-water path.
CHANNELS="-:PMREC=1,SNNI_POOLREC=1,SNNI_MARKER_SAMPLE=1"

# REPLICATES: LOWERED TO ONE, 2026-08-05, and the earlier reasoning here was wrong about the cost.
#
# It estimated 17.6 hours per run from the earlier campaign's stock figure. MEASURED on this
# campaign's own instrument: T=16 takes **22 h 45 min** and T=72 takes **13 h 20 min**, both at the
# declared depth of two layers. Three replicates of the T=16 baseline alone is 68 hours of a
# `bigsmp` node, and the node is also the only place ARION's 1.5 TB Go census can run -- so the
# third replicate was not costing machine-days in the abstract, it was costing another system its
# measurement.
#
# WHAT IS GIVEN UP, STATED RATHER THAN GLOSSED: with n=1 a row carries no spread, so `free` and
# `paid` cannot be decided against this system's own noise and rule 6 is not checkable on it from
# the replicates alone. Where a cost class is needed here it has to come from a difference large
# enough that no plausible spread could explain it -- the T=72 -> T=16 lever is -36.0% memory for
# +70.6% runtime, which is that kind of difference -- and it is declared as resting on that
# argument rather than on a measured spread.
#
# `make_steps.py` publishes `n_runs=1` on every such row, so the weaker claim travels with the
# number instead of living only here.
REPLICATES=1
