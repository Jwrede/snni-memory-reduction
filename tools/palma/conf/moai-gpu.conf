# MOAI-GPU: what is specific to this system. Instrument settings are NOT here, they are in
# campaign.env and apply to every system.

WORKDIR=/scratch/tmp/j_wred02/snni_campaign/moai-gpu
SBATCH=moai_gpu_campaign.sbatch
DERIVE=derive.sbatch

# ONE RUN PER STEP, ONE COMBINED CHANNEL (2026-08-21), for the reason README.md gives and
# with the same measured justification as SIGMA-GPU's conf spells out. This used to read
#
#     CHANNELS="-: _attrib:ATTRIB=1 _pmrec:PMREC=1"      # three runs per replicate
#
# On a system where one run is 56 minutes, three channels x ten steps is thirty GPU-hours spent
# buying an object list that describes a different execution from the peak it is printed beside.
#
# MEASURED here, `s13` image, one whole H200:
#
#     clean, no recorder   2,116,948 kB
#     pmrec alone          2,121,896      +0.23%
#     cudarec alone        2,138,456      +1.02%
#     both, one run        2,149,284      +1.53%   and the device peak is BYTE-IDENTICAL
#
# The costs simply add, and both tables are named mappings that `smaps_objects.py` labels
# `instrument:` and subtracts. The first attempt at this measurement reported +2109% and was an own
# goal: it was named `x_combined_h200`, which matches none of the `s5_*|...|s2[0-9]_*` patterns that
# turn the disk bank on, so `offload_cipher_to_host` parked 42.6 GiB of ciphertext in host RAM.
# A step id is an INPUT to this system's sbatch, not a label.
#
# The `_attrib` blocker below is HISTORY, kept because it records how the device channel was built.
# It was closed by `tools/attrib_device/cudarec.so`, which is what the combined channel now carries.
CHANNELS="-:PMREC=1,ATTRIB=1,SNNI_COMBINED=1"

# Workload: ONE BERT-base encoder layer, batch 256, seq 128, on one full H200. The campaign
# workload is twelve layers; this system runs one, DECLARED, for the reason recorded in its
# MANIFEST (the peak is bootstrap-dominated and flat per layer, and the whole batch dimension is
# welded to the ring). The weaker scope travels with every number, exactly as MOAI-CPU's
# `replicates: 1` does.

# =================================================================================================
# BEFORE THIS SYSTEM CAN RUN. None of it is done yet, and the first item is the large one.
#
#  1. *** THERE IS NO DEVICE ATTRIBUTION MECHANISM FOR THIS SYSTEM, AND THE HARNESS DOES NOT SAY
#     SO ANYWHERE ELSE. ***
#
#     `tools/attrib_gpu/` is ONE file, `sitecustomize.py`: it rides in on PYTHONPATH, arms torch's
#     memory recorder in `state` mode, and snapshots at each new allocation maximum;
#     `tools/torch_peak_objects.py` then turns that pickle into `objects_vram.jsonl`.
#     `measure.sh:58` writes `attrib_device=torch_state` unconditionally. Every part of that chain
#     assumes torch.
#
#     MOAI-GPU is a C++/CUDA binary (`/moai/build/test`) on PhantomFHE, allocating through
#     `cudaMallocAsync` pools. There is no torch and no PYTHONPATH to inject into, so the
#     `_attrib` channel produces NOTHING and, like ARION's `_pmrec` channel on Go, it returns an
#     EMPTY TABLE rather than an error. That is this campaign's standing failure shape.
#
#     What DOES carry over: the peak VALUE. `make_steps.py:284 device_peak()` reads
#     `GPUPEAK|...peak_reserved_kb=` out of `logs/**/all_markers.txt` and does not care who wrote
#     the line, so a poller in the sbatch can supply it. What does NOT carry over is the object
#     DECOMPOSITION, and that is the half the procedure actually selects on: every step needs a
#     non-empty `object_targeted` with a cited evidence line, and `object_attacked` is declared in
#     `levers.env` and compared against the measurement. Without `objects_vram.jsonl` no VRAM step
#     can be conformant, and VRAM is the pool that binds here (the old campaign measured host flat
#     at ~3.2 GiB against 129 GiB VRAM).
#
#     *** AND THE OBVIOUS WAY TO BUILD ONE IS NOT AVAILABLE AS THE PROGRAM IS LINKED. ***
#     Measured on the image, jobs 45519537 and 45519542, not inferred:
#         nm --defined-only /moai/build/test  ->  `00000000001b8c30 T cudaMallocAsync`
#         readelf -d NEEDED                   ->  libntl, libgomp, libstdc++, libm, libgcc_s, libc
#     No libcudart and no libcuda: the CUDA runtime is linked STATICALLY from
#     `libcudart_static.a`, so `cudaMallocAsync` is defined inside the executable and Phantom's
#     calls bind to it directly. An executable's own definition wins symbol resolution, so a
#     preloaded one is never consulted. There are also no undefined `cu*` driver symbols and no
#     `cuGetProcAddress`, so there is nothing to interpose one level down either, and CUPTI is
#     absent from the image (PALMA offers it only against CUDA 12.4/13.0 versus this 11.8 runtime).
#     LD_PRELOAD, the mechanism every host recorder in this campaign uses, is therefore out.
#
#     Two ways forward, and which one is taken is being MEASURED rather than argued:
#       (a) link cudart dynamically (one CMake variable, `CMAKE_CUDA_RUNTIME_LIBRARY=Shared`).
#           LD_PRELOAD then works and the recorder is pmrec's design unchanged. The price is a
#           build that differs from upstream in its link mode, which is declarable and is applied
#           identically to the baseline and every step, exactly as the seed and the gate emitter
#           are -- PROVIDED it does not move the peak.
#       (b) a CUPTI injection library via `CUDA_INJECTION64_PATH`. True zero modification, much
#           more work, version-fragile, and its failure mode is an empty table rather than an error.
#     Whether (a) costs anything is a measurement: `impl/diag_build_linkmode.sbatch` builds the
#     instrumented pristine source twice from ONE tree differing only in that variable and proves
#     the link modes actually differ; `impl/diag_run_linkmode.sbatch` then runs both THREE TIMES
#     each. Three, because the retired campaign documented a +-1.5 to 2.5 GiB pool-fragmentation
#     band across runs of one binary, so a single run per build could differ by more than the
#     effect and say nothing. The question is whether the between-build difference exceeds the
#     within-build spread. Jobs 45519604 (build) -> 45519606 (array), chained by SLURM dependency.
#
#     Whichever way it lands, the recorder itself is then the CUDA analogue of
#     `attrib_resident/pmrec.so`: interpose the allocation entry points the binary actually uses
#     and record (ptr, size, call site) with a snapshot at each new maximum. Two notes before
#     starting.
#     Check the imports of the measured binary against the set of intercepted entry points, with
#     `nm -D`, BEFORE trusting a first object table: that is exactly how `pmrec` missed every SEAL
#     allocation for a whole BumbleBee line by not hooking `aligned_alloc`, and the symptom was a
#     plausible ranking of the wrong objects, not an error. And Phantom hands out memory from a
#     RETAINED `cudaMallocAsync` pool, so the recorder must distinguish pool_used from
#     pool_reserved; the old campaign found the reported peak tracks RESERVED while the live set is
#     ~13% lower, and conflating them names the wrong object.
#
#     Until that exists this system can measure a VRAM peak and cannot attack it.
#
#  2. The baseline must be the PRISTINE upstream, and the local checkout is not on it.
#     `/mnt/HC_Volume_105187419/projects/moai_gpu_src` sits on branch `waterfall-final` at d2792f3
#     (s24, the retired campaign's endpoint). Pristine is `origin/main` = b780f62, the repo root
#     commit, from github.com/dtc2025ag/MOAI_GPU. `main` is OURS: it forks at da266b5 (s16) and
#     carries h1 on top, so it is not a baseline either. Build s0 from b780f62 plus the two
#     campaign-wide additions in item 3, and nothing else.
#
#  3. No gate exists, and the reason is worse than "nobody wrote one".
#     The pristine test has NO assertion at all: every decrypt check is commented out and the
#     caller prints "single layer test passed!" unconditionally, so a passing run means only that
#     it did not crash. This is the SIGMA-GPU defect class, and the campaign already has a guard
#     for it: an observable must be shown to DISTINGUISH, not merely to exist.
#     A fingerprint emitter was written for the retired campaign (89e1c89, current form at
#     `src/include/test/test_single_layer.cuh:1346`, the `FP|` block: per-ciphertext decrypt, then
#     n / sum / sumsq / mean / absmax over the b_vec slots). It is the right observable and it is
#     NOT usable until item 4 is done, because today the per-slot values are uncorrelated between
#     runs.
#     Note what the gate does and does not claim here. PROCEDURE compares a step against the
#     BASELINE, never against an external reference, so it tests whether THIS STEP changed
#     anything. That test is meaningful even on a program whose output is wrong. Item 5 is where
#     that stops being enough.
#
#  4. Seeds are unpinned and README.md still says `unknown`. `PhantomSecretKey secret_key(context)`
#     (`test_single_layer.cuh:436`) draws through Phantom's own PRNG, and each key-switching key
#     component draws a fresh `prng_seed_a` via `random_bytes()` (`secretkey.cu:355-356`). Pin it,
#     emit a `SEEDED|` marker, fail the run when the marker is absent, then run twice unchanged and
#     compare the fingerprint byte for byte. Two runs is the whole check and it is the one that
#     would have caught SHAFT-GPU immediately.
#
#  5. CLOSED 2026-07-30. The validity question was a MEMORY question, not only a correctness one,
#     because a CKKS ciphertext's SIZE is `2 * (level+1) * N * 8` bytes and is therefore set by its
#     LEVEL, which in CKKS is kept in sync with the scale by hand. Wrong levels would have meant
#     the measured footprint is not the correct program's footprint.
#     THE LEVELS ARE RIGHT. Working in `systems/moai-gpu/level-audit.md`. It cost no cluster time:
#     the pristine program already prints its modulus chain index at sixteen phase boundaries and
#     the retired baseline captured all of them. Every transition traces to the source, all four
#     bootstraps return to `remaining_level = 20`, and the levels predict the measured pool
#     occupancy with nothing fitted (`inputs_prepared` = 768 * (15 + 21) MiB = 27,648 predicted
#     against 27,648.0 measured; two separate bootstraps both +42,239.9 MiB).
#     What remains is a correctness caveat that travels with every number: the output is still
#     numerically invalid. The check is one-sided in the direction that matters, since wrong values
#     on right levels is the observed pattern and right values on wrong levels is impossible.
#
#  6. The old sbatch (`moai_gpu_waterfall.sbatch`) is NOT portable to this harness. It carries its
#     own 100 ms nvidia-smi and VmRSS pollers, its own PEAK.txt arithmetic and no policy at all.
#     Port to `tools/palma/templates/system.sbatch` rather than patching it, the same instruction
#     SHAFT-GPU's row in ONBOARDING carries. Note one thing it got right and the template does not
#     do for you: `pgrep -x test` finds the payload because apptainer shares the host PID
#     namespace. Use `snni_find_payload "$APP_PID" test`.
#
#  7. Queue: the retired campaign ran `--partition=gpuh200 --gres=gpu:1 --mem=110G` at ~2708 s per
#     default run, so a three-replicate step is roughly 2.5 h of GPU plus queue. Full-card jobs
#     were hours when `gpu:1` was requested and days at `gpu:2`. Ask for one.

# REPLICATES: LOWERED TO ONE, 2026-08-06, at the user's instruction, for the same reason MOAI-CPU
# and ARION were: the binding constraint is a contended shared resource, not machine time.
#
# On this system a run takes 56 minutes, so three replicates x three channels is nine GPU-hours per step on `gpuh200` -- a partition with two live nodes (the third has been down with PCIe errors since 2026-07-27), all sixteen GPUs allocated to other users' multi-day jobs.
#
# WHAT IS GIVEN UP, STATED RATHER THAN GLOSSED: with n=1 a row carries no spread, so free-vs-paid
# cannot be decided against this system's own noise. `make_steps.py` no longer hides that -- it
# publishes `cost_type=undetermined` unless the step DECLARES its class in levers.env as
# `# cost_class: free` or `paid`, and the row then records that the class is declared rather than
# measured. A declaration is only honest where the argument does not need a spread: a buffer written
# by nothing and read by nothing costs nothing by construction, and no number of replicates would
# add to that.
#
# WHAT IS NOT GIVEN UP: this system's BASELINE was measured at n=3 and keeps its spread. Only the
# steps run singly, so every row is quoted against a predecessor whose reproducibility is
# established. That is a better position than MOAI-CPU's, where the baseline itself is n<3.
REPLICATES=1
