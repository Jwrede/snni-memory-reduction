# SHAFT-GPU: what is specific to this system. Instrument settings are NOT here, they are in
# campaign.env and apply to every system.

WORKDIR=/scratch/tmp/j_wred02/snni_campaign/shaft-gpu
SBATCH=shaft_gpu_campaign.sbatch
DERIVE=derive.sbatch

# TWO POOLS, so three runs per replicate. The device and host profilers measure different pools
# and have no reason to share a process; running them together produced a deadlock that cost four
# revisions of a since-retired tool, and the harness refuses to enable both at once.
#
#   -        the clean run: the ONLY run whose peaks and wall time may be published
#   _attrib  device composition, torch state mode plus a snapshot at each new maximum
#   _pmrec   host composition in RESIDENT bytes, pmrec + pagemap
#
# The suffixes are the convention harvest_step.sh already reads: `<step>` to logs/,
# `<step>_attrib` to attrib/device/, `<step>_pmrec` to attrib/resident/.
# THE HOST RECORDER RIDES ALONG WITH THE MEASURED RUN. It used to be its own channel, so the
# object list came from a DIFFERENT RUN than the peak -- the arrangement README.md retired,
# and this system showed exactly why: measured 2026-07-31, the resident table sat 16.3% BELOW its
# run's peak in one replicate and 17.1% ABOVE it in another, which is impossible when both come
# from one execution and is the signature of two. The smaps half, which does come from the
# measured run, sat within 0.3% of the peak in all three.
#
# The recorder costs one thing: its own named mapping, whose resident size is read at the peak and
# subtracted by name, so the peak stays the program's. The DEVICE channel stays separate, because
# the two profilers have no reason to share a process and running them together deadlocked a
# since-retired tool.
# ONE CHANNEL since 2026-08-01: both recorders ride along with the measured run.
#
# The device snapshotter used to be its own run, on the ground that two profilers have no reason to
# share a process and that running two together once deadlocked a since-retired tool (memray).
# Whether that held for THIS pair was never tested until it was measured on this very system --
# three replicates, both channels in one process, jobs 45560087/207/208: no deadlock, both tables in
# every run, gate byte-identical, VRAM byte-identical, alignment unchanged at 0.00% and 100.0%.
# README.md now permits the pair; memray still runs alone.
#
# Taken here for two reasons. It removes the last cross-run pairing on this system: the device table
# came from a DIFFERENT execution than the published peak, which was defensible only because VRAM
# reproduces byte for byte, and is now unnecessary. And it halves the queue entries per step, which
# on `gpuh200` is what a step actually costs -- the runs are 90 seconds, the waits are hours.
# Done at the moment the whole line is re-measured for the machine move, so no published row mixes
# the two arrangements.
CHANNELS="-:PMREC=1,ATTRIB=1,SNNI_COMBINED=1"

# The four blockers this file used to list are closed: the sbatch takes the policy from the
# environment and fails without it, the full scan is wired in, s0 was re-measured from scratch
# frozen and at the campaign floor, and s1's choice was re-derived from that new table.
#
# WHAT REPLACED THEM, 2026-08-01: the system moved off the `gpuh200mini` MIG slice to a whole
# H200 on `gpuh200`, because a slice shares the physical GPU and the runtime axis was therefore
# uncontrolled -- the same lever measured +74.8% and -40.3% in two sets of runs of one image. The
# unit of placement is a whole system, so every step is re-measured after the move and the MIG
# measurements are kept under steps.superseded-mig-20260801/ for the comparison. Nothing measured
# on the slice may be mixed into the new line.
