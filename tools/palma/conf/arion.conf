# ARION: what is specific to this system. Instrument settings are NOT here, they are in
# campaign.env and apply to every system.

WORKDIR=/scratch/tmp/j_wred02/snni_campaign/arion
SBATCH=arion_campaign.sbatch
DERIVE=derive.sbatch

# SINGLE POOL (host), SINGLE PROCESS. ARION is non-interactive pure FHE in Go: there is no device
# pool and there are no parties, so both degenerate cases apply at once.
#
# The recorder rides along even though it is EXPECTED to come back empty, and that is deliberate.
# Go's runtime takes memory by mmap and manages it itself, so an LD_PRELOAD allocator interceptor
# is blind here by construction. Running it anyway means every published run carries the evidence
# for that claim in its own artifacts, instead of the claim living only in a MANIFEST sentence --
# and if a future ARION ever allocates through cgo, the table stops being empty and says so.
# The Go heap channel is what gives this system a decomposition at all: the malloc recorder
# cannot see a Go runtime, so without it every peak lands in anon:residual and no step can be
# chosen. It is a CHANNEL rather than a probe so that run N of it pairs with run N of the
# clean run, which is the K1/K2 rule the two-pool systems already follow.
# ONE RUN PER STEP (2026-09-24). The Go heap census runs inside the measured run (SNNI_COMBINED=1,
# census_hook.sh via poll_peak.sh), like every other system since the 2026-08-21 correction. The
# earlier `_goheap` second channel is retired; a1-a4 measured with it are re-measured.
CHANNELS="-:PMREC=1,GOHEAP=1,SNNI_COMBINED=1"

# REPLICATES: LOWERED TO ONE, 2026-08-05, for the same reason as MOAI-CPU and with the same caveat.
#
# This system's decomposition needs the Go heap census, which requires a whole `bigsmp` node: 1.5 TB
# requested, ~600 GB written transiently for the dump. There are three such nodes on the cluster and
# they are shared with MOAI-CPU, whose replicates run 13 to 23 hours each. Three replicates here
# would mean the two systems take turns for days while neither finishes.
#
# WHAT IS GIVEN UP: a row with n=1 carries no spread, so no cost class can be decided against this
# system's own noise. Any `free` or `paid` on this line has to rest on a stated argument rather than
# on a measured spread, and `make_steps.py` puts `n_runs=1` on the row so the weaker claim travels.
REPLICATES=1
