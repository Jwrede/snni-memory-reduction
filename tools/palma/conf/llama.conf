# LLAMA online: what is specific to this system. Instrument settings are NOT here, they are in
# campaign.env and apply to every system.

WORKDIR=/scratch/tmp/j_wred02/snni_campaign/llama
SBATCH=llama_online.sbatch
DERIVE=derive.sbatch

# Single pool (host). Same degenerate case as the dealer: no device component.
CHANNELS="-:PMREC=1"

# THREE PROCESSES, TWO OF THEM MEASURED. The protocol is dealer + server + client, all on
# loopback. The dealer streams key material to its peers rather than through the 47 GB of files
# the dealer-alone line writes, so running all three concurrently removes the key-staging problem
# instead of solving it.
#
# The poller attaches to parties 2 and 3 ONLY. The dealer is present as the protocol requires and
# is not the subject: this system measures the ONLINE role, which is what makes it a different
# system from llama-dealer rather than another view of it.
#
# BEFORE THIS SYSTEM CAN RUN:
#  1. The online path calls net.load("bert-tiny-weights.dat") and input.load("15469.dat"). Neither
#     file exists, neither is baked into the image, and the name is bert-tiny while the dimensions
#     were changed to bert-base. See impl/patches/.
#  2. srand(time(NULL)) at bertbenchmark.cpp, same defect as SIGMA-GPU had.
#  3. The protocol target for the ONLINE role is not the dealer's 72 MB and has to be derived
#     separately from source.
